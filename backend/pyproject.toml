readme = "README.md"
authors = [
    { name = "Abrar Rizvi", email = "abrar8949@gmil.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt==4.0.1",
    "fastapi>=0.141.1",
    "google-genai>=2.18.1",
    "groq>=1.7.0",
    "passlib[bcrypt]==1.7.4",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
